<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>College Event Ticket Booking</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f6f9; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .card { background: #ffffff; max-width: 550px; width: 100%; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); padding: 32px; }
        h1 { margin-top: 0; color: #1e293b; font-size: 24px; text-align: center; }
        .alert { background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; color: #334155; margin-bottom: 6px; font-size: 14px; }
        input, select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #3b82f6; ring: 2px solid #93c5fd; }
        .btn { width: 100%; background: #2563eb; color: #fff; font-weight: 600; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 8px; }
        .btn:hover { background: #1d4ed8; }
        .slot-badge { color: #059669; font-size: 12px; font-weight: bold; }
        .sold-out { color: #dc2626; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>
<div class="card">
    <h1>🎟 College Event Registration</h1>

    <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}"></div>

    <form th:action="@{/book}" method="post">
        <div class="form-group">
            <label for="studentName">Student Full Name</label>
            <input type="text" id="studentName" name="studentName" required placeholder="e.g. Alex Johnson">
        </div>

        <div class="form-group">
            <label for="registerNo">College Register Number</label>
            <input type="text" id="registerNo" name="registerNo" required placeholder="e.g. 21BCE1042">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@college.edu">
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="e.g. 9876543210">
        </div>

        <div class="form-group">
            <label for="eventName">Select Event</label>
            <select id="eventName" name="eventName" required>
                <option value="" disabled selected>-- Choose an Event --</option>
                <option th:each="event : ${events}"
                        th:value="${event.name}"
                        th:disabled="${event.availableSlots <= 0}"
                        th:text="${event.name + ' (' + event.availableSlots + ' slots left)'}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn">Confirm & Generate Ticket</button>
    </form>
</div>
</body>
</html>
