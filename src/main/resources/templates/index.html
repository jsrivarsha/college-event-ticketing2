<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishnu Women's University | Event Ticket Booking</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); 
            margin: 0; 
            padding: 40px 20px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center; 
            align-items: center;
        }

        .card { 
            background: #ffffff; 
            max-width: 550px; 
            width: 100%; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25); 
            padding: 36px 32px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #4338ca;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        h1 { 
            margin: 0 0 6px 0; 
            color: #1e1b4b; 
            font-size: 22px; 
            font-weight: 800;
        }

        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin: 0;
        }

        .alert { 
            background: #fee2e2; 
            border-left: 4px solid #ef4444; 
            color: #991b1b; 
            padding: 12px 16px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-size: 14px; 
            font-weight: 500;
        }

        .form-group { margin-bottom: 18px; }

        label { 
            display: block; 
            font-weight: 600; 
            color: #334155; 
            margin-bottom: 6px; 
            font-size: 13px; 
        }

        input, select { 
            width: 100%; 
            padding: 11px 14px; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            background: #f8fafc;
            color: #0f172a;
            transition: all 0.2s ease;
        }

        input:focus, select:focus { 
            border-color: #6366f1; 
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); 
        }

        .btn { 
            width: 100%; 
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); 
            color: #fff; 
            font-weight: 700; 
            padding: 13px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
            margin-top: 8px; 
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn:hover { 
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header-section">
        <span class="badge">Campus Pass Portal</span>
        <h1>Vishnu Women's University</h1>
        <p class="subtitle">🎟 Event Registration & Instant QR Ticket</p>
    </div>

    <div th:if="${errorMessage}" class="alert" th:text="${errorMessage}"></div>

    <form th:action="@{/book}" method="post">
        <div class="form-group">
            <label for="studentName">Student Full Name</label>
            <input type="text" id="studentName" name="studentName" required placeholder="e.g. Alex Johnson">
        </div>

        <div class="form-group">
            <label for="registerNo">College Register Number</label>
            <input type="text" id="registerNo" name="registerNo" required placeholder="e.g. 21BCE1042">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@college.edu">
        </div>

        <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required placeholder="e.g. 9876543210">
        </div>

        <div class="form-group">
            <label for="eventName">Select Event</label>
            <select id="eventName" name="eventName" required>
                <option value="" disabled selected>-- Choose an Event --</option>
                <option th:each="event : ${events}"
                        th:value="${event.name}"
                        th:disabled="${event.availableSlots <= 0}"
                        th:text="${event.name + ' (' + event.availableSlots + ' slots left)'}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn">Confirm & Generate Ticket</button>
    </form>
</div>

</body>
</html>
