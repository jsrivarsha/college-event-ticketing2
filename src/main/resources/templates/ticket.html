<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Event Ticket</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; margin: 0; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .ticket { background: #ffffff; border-radius: 16px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; border-top: 8px solid #2563eb; }
        .header { background: #f8fafc; padding: 24px; text-align: center; border-bottom: 2px dashed #e2e8f0; }
        .header h2 { margin: 0; color: #1e293b; font-size: 20px; }
        .header p { margin: 6px 0 0; color: #64748b; font-size: 13px; letter-spacing: 1px; font-weight: 600; }
        .details { padding: 24px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 14px; }
        .label { color: #64748b; }
        .value { color: #0f172a; font-weight: 600; text-align: right; }
        .qr-section { text-align: center; padding: 16px 24px 28px; background: #fafafa; border-top: 2px dashed #e2e8f0; }
        .qr-section img { width: 190px; height: 190px; border-radius: 8px; border: 1px solid #e2e8f0; padding: 6px; background: #fff; }
        .token { font-family: monospace; font-size: 16px; font-weight: 700; color: #2563eb; margin-top: 10px; }
        .btn-back { margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .btn-back:hover { color: #ffffff; text-decoration: underline; }
        @media print {
            body { background: transparent; padding: 0; }
            .btn-back { display: none; }
            .ticket { box-shadow: none; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="ticket">
    <div class="header">
        <h2 th:text="${booking.eventName}">Event Name</h2>
        <p>ADMISSION PASS</p>
    </div>

    <div class="details">
        <div class="row">
            <span class="label">Attendee</span>
            <span class="value" th:text="${booking.studentName}">Student Name</span>
        </div>
        <div class="row">
            <span class="label">Register No</span>
            <span class="value" th:text="${booking.registerNo}">21BCE1000</span>
        </div>
        <div class="row">
            <span class="label">Email</span>
            <span class="value" th:text="${booking.email}">email@domain.com</span>
        </div>
        <div class="row">
            <span class="label">Phone</span>
            <span class="value" th:text="${booking.phoneNumber}">9876543210</span>
        </div>
    </div>

    <div class="qr-section">
        <img th:src="'data:image/png;base64,' + ${qrBase64}" alt="Ticket QR Code" />
        <div class="token" th:text="${booking.tokenId}">TKT-XXXXXX</div>
        <p style="margin: 6px 0 0; color: #94a3b8; font-size: 11px;">Present this QR code at the event entrance</p>
    </div>
</div>

<a href="/" class="btn-back">← Book another event</a>

</body>
</html>
